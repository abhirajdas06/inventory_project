<div class="modal fade" id="auditModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content p-3">

        <h5 class="mb-3">Audit Spare</h5>

        <input type="hidden" id="auditProductId">

        <div class="mb-2">
            <label>Audit Date</label>
            <input type="date" id="auditDate" class="form-control">
        </div>

        <div class="mb-2">
            <label>Audit Result</label>
            <select id="auditResult" class="form-control">
                <option value="FOUND" selected>Found</option>
                <option value="NOT_FOUND">Not Found</option>
            </select>
        </div>

        <div class="mb-2">
            <label>Remark</label>
            <textarea id="auditRemark" class="form-control"></textarea>
        </div>

        <button class="btn btn-warning w-100 mt-2" id="saveAudit">
            Confirm Audit
        </button>

    </div>
  </div>
</div>
